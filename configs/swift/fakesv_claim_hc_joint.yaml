ENV:
  CUDA_VISIBLE_DEVICES: "4,5,6,7"
  NPROC_PER_NODE: "4"
  VIDEOMMD_CLAIM_HC_ENABLE: "true"
  VIDEOMMD_CLAIM_HC_EXPERT_RANK: "8"
  VIDEOMMD_CLAIM_HC_NUM_FAKE_EXPERTS: "4"
  VIDEOMMD_CLAIM_HC_ROUTER_TEMPERATURE: "1.0"
  VIDEOMMD_CLAIM_HC_ORTHOGONALITY_LOSS: "0.1"

model: /data2/573ops_ser/models/InternVL-8B
dataset: /data2/573ops_ser/projects/videommd/data/swift/fakesv/fakesv_train.jsonl
acc_strategy: seq
system: |-
  你是一个短视频虚假新闻检测助手。请根据视频内容和给定的文本上下文，判断该短视频所表达的新闻事件或主张是真实还是虚假。只回答一个词：real 或 fake。
template: internvl2_5
torch_dtype: bfloat16
attn_impl: flash_attn
num_train_epochs: 4
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
split_dataset_ratio: 0.0
learning_rate: 3e-5
lora_rank: 8
lora_alpha: 32
target_modules: all-linear
modules_to_save:
  - claim_hc
freeze_vit: true
freeze_aligner: true
ddp_find_unused_parameters: true
save_strategy: epoch
eval_strategy: "no"
load_best_model_at_end: false
save_steps: 1
save_total_limit: 4
logging_steps: 10
max_length: 8192
output_dir: /data2/573ops_ser/projects/videommd/outputs/swift/fakesv_claim_hc_shared4_orth
warmup_ratio: 0.1
data_seed: 42
seed: 42
temperature: 0
dataloader_num_workers: 4
