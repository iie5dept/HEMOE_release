ENV:
  CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  CLAIM_HC_USE_GENERAL_EXPERT: "false"
  CLAIM_HC_USE_CLAIM_VERIFIER_EXPERT: "true"
  CLAIM_HC_GATE_TYPE: "flat"
  CLAIM_HC_USE_AUX_CLS_LOSS: "true"
  CLAIM_HC_USE_DECORRELATION_LOSS: "true"
  CLAIM_HC_LAMBDA: "0.2"
  CLAIM_HC_DECORRELATION_WEIGHT: "0.05"

dataset: /data2/573ops_ser/projects/videommd/data/swift/fakett/fakett_test.jsonl
system: |-
  You are a multimodal assistant for short-video news veracity detection.
template: internvl2_5
max_batch_size: 4
torch_dtype: bfloat16
infer_backend: transformers
max_length: 8192
attn_impl: flash_attn
split_dataset_ratio: 1.0
max_new_tokens: 1
metric: acc
data_seed: 2025
seed: 2025
temperature: 0
result_path: /data2/573ops_ser/projects/videommd/outputs/swift/fakett_hc_no_general/fakett_test_predictions.jsonl
