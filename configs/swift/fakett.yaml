ENV:
  CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  NPROC_PER_NODE: "8"

model: /data2/573ops_ser/models/InternVL-8B
dataset: /data2/573ops_ser/projects/videommd/data/swift/fakett/fakett_train.jsonl
val_dataset: /data2/573ops_ser/projects/videommd/data/swift/fakett/fakett_val.jsonl
acc_strategy: seq
system: |-
  You are a multimodal fake-news detection assistant. Judge whether the short news video is real or fake according to the visual content and the provided textual context. Reply with exactly one word: real or fake.
template: internvl2_5
torch_dtype: bfloat16
attn_impl: flash_attn
num_train_epochs: 5
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
split_dataset_ratio: 0.0
learning_rate: 8e-5
lora_rank: 8
lora_alpha: 32
target_modules: all-linear
freeze_vit: true
freeze_aligner: true
ddp_find_unused_parameters: false
save_strategy: epoch
eval_strategy: epoch
eval_steps: 1
save_steps: 1
save_total_limit: 5
logging_steps: 10
max_length: 8192
output_dir: /data2/573ops_ser/projects/videommd/outputs/swift/fakett
warmup_ratio: 0.1
data_seed: 2025
seed: 2025
temperature: 0
dataloader_num_workers: 4
