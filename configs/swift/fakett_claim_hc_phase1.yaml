ENV:
  CUDA_VISIBLE_DEVICES: "4,5,6,7"
  NPROC_PER_NODE: "4"
  VIDEOMMD_CLAIM_HC_ENABLE: "true"
  VIDEOMMD_CLAIM_HC_STAGE: "phase1"
  VIDEOMMD_CLAIM_HC_EXPERT_RANK: "8"
  VIDEOMMD_CLAIM_HC_TOP_K: "2"
  VIDEOMMD_CLAIM_HC_BALANCE_LOSS: "0.0"

model: /data2/573ops_ser/models/InternVL-8B
dataset: /data2/573ops_ser/projects/videommd/data/swift/fakett/fakett_train.jsonl
val_dataset: /data2/573ops_ser/projects/videommd/data/swift/fakett/fakett_val.jsonl
acc_strategy: seq
system: |-
  You are a multimodal assistant for short-video news veracity detection.
template: internvl2_5
torch_dtype: bfloat16
attn_impl: flash_attn
num_train_epochs: 5
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
split_dataset_ratio: 0.0
learning_rate: 8e-5
lora_rank: 8
lora_alpha: 32
target_modules: all-linear
modules_to_save:
  - claim_hc
freeze_vit: true
freeze_aligner: true
ddp_find_unused_parameters: true
save_strategy: epoch
eval_strategy: epoch
load_best_model_at_end: true
metric_for_best_model: seq_acc
greater_is_better: true
eval_steps: 1
save_steps: 1
save_total_limit: 5
logging_steps: 10
max_length: 8192
output_dir: /data2/573ops_ser/projects/videommd/outputs/swift/fakett_claim_hc_phase1_ddpfix
warmup_ratio: 0.1
data_seed: 42
seed: 42
temperature: 0
dataloader_num_workers: 4
