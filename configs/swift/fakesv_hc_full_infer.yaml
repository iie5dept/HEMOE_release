ENV:
  CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  CLAIM_HC_USE_GENERAL_EXPERT: "true"
  CLAIM_HC_USE_CLAIM_VERIFIER_EXPERT: "true"
  CLAIM_HC_GATE_TYPE: "hierarchical"
  CLAIM_HC_USE_AUX_CLS_LOSS: "true"
  CLAIM_HC_USE_DECORRELATION_LOSS: "true"
  CLAIM_HC_LAMBDA: "0.2"
  CLAIM_HC_DECORRELATION_WEIGHT: "0.05"

dataset: /data2/573ops_ser/projects/videommd/data/swift/fakesv/fakesv_test.jsonl
system: |-
  你是一个短视频虚假新闻检测助手。请根据视频内容和给定文本上下文，判断该短视频所表达的新闻事件或主张是真实还是虚假。只回答一个词：real 或 fake。
template: internvl2_5
max_batch_size: 4
torch_dtype: bfloat16
infer_backend: transformers
max_length: 8192
attn_impl: flash_attn
split_dataset_ratio: 1.0
max_new_tokens: 1
metric: acc
data_seed: 2025
seed: 2025
temperature: 0
result_path: /data2/573ops_ser/projects/videommd/outputs/swift/fakesv_hc_full/fakesv_test_predictions.jsonl
